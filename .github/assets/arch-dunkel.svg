<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%">
  <defs>
    <style>
      .n { animation: pulse 2.8s ease-in-out infinite; }
      .line { stroke-dasharray: 6 4; animation: dash 1.6s linear infinite; }
      @keyframes pulse { 0%,100% { opacity:.6 } 50% { opacity:1 } }
      @keyframes dash { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .n, .line { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="360" rx="16" fill="#0D1117" stroke="#21262D"/>
  <text x="48" y="48" font-family="system-ui" font-size="13" font-weight="600" fill="#7D8590" letter-spacing="1.6">ARCHITECTURE</text>
  <g font-family="system-ui" font-size="13" fill="#F0F6FC" text-anchor="middle">
    <rect class="n" x="60" y="120" width="200" height="64" rx="12" fill="#161B22" stroke="#2EA6DA" stroke-width="1.5"/>
    <text x="160" y="156">Svelte 5 / Leptos</text>
    <rect class="n" x="320" y="120" width="180" height="64" rx="12" fill="#161B22" stroke="#2EA6DA" stroke-width="1.5" style="animation-delay:.15s"/>
    <text x="410" y="156">Tauri Shell</text>
    <rect class="n" x="560" y="110" width="220" height="84" rx="12" fill="#2EA6DA"/>
    <text x="670" y="158" fill="#0D1117" font-weight="600">Shared Rust Core</text>
    <rect class="n" x="840" y="120" width="180" height="64" rx="12" fill="#161B22" stroke="#2EA6DA" stroke-width="1.5" style="animation-delay:.3s"/>
    <text x="930" y="156">agent-core</text>
    <rect class="n" x="1060" y="120" width="160" height="64" rx="12" fill="#161B22" stroke="#2EA6DA" stroke-width="1.5" style="animation-delay:.45s"/>
    <text x="1140" y="156">Providers</text>
  </g>
  <path class="line" d="M260 152 H320 M500 152 H560 M780 152 H840 M1020 152 H1060" stroke="#2EA6DA" stroke-width="1.5" fill="none"/>
</svg>
