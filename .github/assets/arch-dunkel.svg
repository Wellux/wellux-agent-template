<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img">
  <title>Wellux architecture: shell, shared core, agent-core, providers</title>
  <defs>
    <style>
      .flow { stroke-dasharray: 5 8; animation: flow 2.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -52; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="300" rx="24" fill="#07141C"/>
  <line class="flow" x1="250" y1="150" x2="390" y2="150" stroke="#3EC4E0" stroke-width="2"/>
  <line class="flow" x1="570" y1="150" x2="710" y2="150" stroke="#3EC4E0" stroke-width="2"/>
  <line class="flow" x1="910" y1="150" x2="1050" y2="150" stroke="#3EC4E0" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g>
      <rect x="48" y="70" width="200" height="160" rx="18" fill="#0D1C26" stroke="#1D3C4A"/>
      <text x="68" y="104" font-size="12" letter-spacing="2" fill="#8EACB8">SHELL</text>
      <text x="68" y="140" font-size="22" font-weight="680" fill="#E7F1F4">Svelte</text>
      <text x="68" y="168" font-size="22" font-weight="680" fill="#E7F1F4">Leptos</text>
      <text x="68" y="200" font-size="16" fill="#8EACB8">Tauri 2</text>
    </g>
    <g>
      <rect x="392" y="70" width="176" height="160" rx="18" fill="#0D1C26" stroke="#3EC4E0"/>
      <text x="412" y="104" font-size="12" letter-spacing="2" fill="#3EC4E0">CORE</text>
      <text x="412" y="146" font-size="22" font-weight="680" fill="#E7F1F4">Shared</text>
      <text x="412" y="178" font-size="22" font-weight="680" fill="#E7F1F4">Rust</text>
    </g>
    <g>
      <rect x="712" y="48" width="196" height="204" rx="18" fill="#102833" stroke="#1D3C4A"/>
      <text x="732" y="82" font-size="12" letter-spacing="2" fill="#8EACB8">AGENT-CORE</text>
      <text x="732" y="118" font-size="16" fill="#E7F1F4">Skills</text>
      <text x="732" y="146" font-size="16" fill="#E7F1F4">Guardrails</text>
      <text x="732" y="174" font-size="16" fill="#E7F1F4">Sandbox</text>
      <text x="732" y="202" font-size="16" fill="#E7F1F4">OpenTelemetry</text>
    </g>
    <g>
      <rect x="1052" y="70" width="180" height="160" rx="18" fill="#0D1C26" stroke="#1D3C4A"/>
      <text x="1072" y="104" font-size="12" letter-spacing="2" fill="#8EACB8">EDGE</text>
      <text x="1072" y="140" font-size="18" font-weight="680" fill="#E7F1F4">OrcaRouter</text>
      <text x="1072" y="168" font-size="16" fill="#8EACB8">Engram</text>
      <text x="1072" y="196" font-size="16" fill="#8EACB8">Ollama</text>
    </g>
  </g>
</svg>
