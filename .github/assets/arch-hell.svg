<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img">
  <title>Wellux architecture: shell, shared core, agent-core, providers</title>
  <defs>
    <style>
      .flow { stroke-dasharray: 5 8; animation: flow 2.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -52; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="300" rx="24" fill="#F3F7F8"/>
  <line class="flow" x1="250" y1="150" x2="390" y2="150" stroke="#0C7C9A" stroke-width="2"/>
  <line class="flow" x1="570" y1="150" x2="710" y2="150" stroke="#0C7C9A" stroke-width="2"/>
  <line class="flow" x1="910" y1="150" x2="1050" y2="150" stroke="#0C7C9A" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g>
      <rect x="48" y="70" width="200" height="160" rx="18" fill="#FFFFFF" stroke="#D0E0E6"/>
      <text x="68" y="104" font-size="12" letter-spacing="2" fill="#4E6A76">SHELL</text>
      <text x="68" y="140" font-size="22" font-weight="680" fill="#102028">Svelte</text>
      <text x="68" y="168" font-size="22" font-weight="680" fill="#102028">Leptos</text>
      <text x="68" y="200" font-size="16" fill="#4E6A76">Tauri 2</text>
    </g>
    <g>
      <rect x="392" y="70" width="176" height="160" rx="18" fill="#FFFFFF" stroke="#0C7C9A"/>
      <text x="412" y="104" font-size="12" letter-spacing="2" fill="#0C7C9A">CORE</text>
      <text x="412" y="146" font-size="22" font-weight="680" fill="#102028">Shared</text>
      <text x="412" y="178" font-size="22" font-weight="680" fill="#102028">Rust</text>
    </g>
    <g>
      <rect x="712" y="48" width="196" height="204" rx="18" fill="#E7F2F5" stroke="#D0E0E6"/>
      <text x="732" y="82" font-size="12" letter-spacing="2" fill="#4E6A76">AGENT-CORE</text>
      <text x="732" y="118" font-size="16" fill="#102028">Skills</text>
      <text x="732" y="146" font-size="16" fill="#102028">Guardrails</text>
      <text x="732" y="174" font-size="16" fill="#102028">Sandbox</text>
      <text x="732" y="202" font-size="16" fill="#102028">OpenTelemetry</text>
    </g>
    <g>
      <rect x="1052" y="70" width="180" height="160" rx="18" fill="#FFFFFF" stroke="#D0E0E6"/>
      <text x="1072" y="104" font-size="12" letter-spacing="2" fill="#4E6A76">EDGE</text>
      <text x="1072" y="140" font-size="18" font-weight="680" fill="#102028">OrcaRouter</text>
      <text x="1072" y="168" font-size="16" fill="#4E6A76">Engram</text>
      <text x="1072" y="196" font-size="16" fill="#4E6A76">Ollama</text>
    </g>
  </g>
</svg>
