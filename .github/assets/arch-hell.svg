<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="100%">
  <defs>
    <style>
      .n { animation: pulse 2.6s ease-in-out infinite; }
      .flow { stroke-dasharray: 8 6; animation: flow 1.4s linear infinite; }
      @keyframes pulse { 0%,100% { opacity:.5 } 50% { opacity:1 } }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @media (prefers-reduced-motion: reduce) { .n, .flow { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="380" rx="16" fill="#FAFBFC" stroke="#E6EAEE"/>
  <text x="48" y="52" font-family="system-ui" font-size="13" font-weight="600" fill="#8A9099" letter-spacing="1.8">ARCHITECTURE</text>
  <g font-family="system-ui" font-size="13" fill="#0F1419" text-anchor="middle">
    <rect class="n" x="48" y="140" width="210" height="68" rx="12" fill="#FFFFFF" stroke="#1B8DBE" stroke-width="1.5"/>
    <text x="153" y="178">Svelte 5 / Leptos</text>
    <rect class="n" x="310" y="140" width="190" height="68" rx="12" fill="#FFFFFF" stroke="#1B8DBE" stroke-width="1.5" style="animation-delay:.12s"/>
    <text x="405" y="178">Tauri Shell</text>
    <rect class="n" x="550" y="128" width="230" height="92" rx="12" fill="#1B8DBE"/>
    <text x="665" y="178" fill="#FFFFFF" font-weight="600">Shared Rust Core</text>
    <rect class="n" x="830" y="140" width="190" height="68" rx="12" fill="#FFFFFF" stroke="#1B8DBE" stroke-width="1.5" style="animation-delay:.24s"/>
