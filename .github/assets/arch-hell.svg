<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img">
<title>Shell, core, doors, edge.</title>
<defs>
<style>
  .flow { stroke-dasharray: 5 9; animation: flow 2.8s linear infinite; }
  .blink { animation: blink 1.15s steps(1) infinite; }
  .pulse { animation: pulse 2.8s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -56; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flow, .blink, .pulse { animation: none; } }
</style>

<linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0C7490" stop-opacity=".16"/>
  <stop offset=".55" stop-color="#0C7490" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="1280" height="360" fill="#F4F7F8"/>

<text x="48" y="72" font-family="ui-sans-serif,system-ui,sans-serif" font-size="40" font-weight="680" fill="#10242C">Four rooms. One direction.</text>
<text x="48" y="110" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="#4C6872">The shell renders. The core decides. The doors stay shut until the keys exist.</text>
<line class="flow" x1="180" y1="224" x2="1100" y2="224" stroke="#0C7490" stroke-width="1.5">
  <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.6s" repeatCount="indefinite"/>
</line>

<rect x="48" y="150" width="248" height="150" rx="18" fill="#FFFFFF" stroke="#D3E1E6"/>
<text x="72" y="196" font-family="ui-monospace,monospace" font-size="14" fill="#0C7490">01</text>
<text x="72" y="236" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="680" fill="#10242C">SHELL</text>
<text x="72" y="268" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#4C6872">ui/  ·  replaceable</text>

<rect x="360" y="150" width="248" height="150" rx="18" fill="#FFFFFF" stroke="#D3E1E6"/>
<text x="384" y="196" font-family="ui-monospace,monospace" font-size="14" fill="#0C7490">02</text>
<text x="384" y="236" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="680" fill="#10242C">CORE</text>
<text x="384" y="268" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#4C6872">policy lives here</text>

<rect x="672" y="150" width="248" height="150" rx="18" fill="#FFFFFF" stroke="#D3E1E6"/>
<text x="696" y="196" font-family="ui-monospace,monospace" font-size="14" fill="#0C7490">03</text>
<text x="696" y="236" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="680" fill="#10242C">DOORS</text>
<text x="696" y="268" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#4C6872">login · pay · model</text>

<rect x="984" y="150" width="248" height="150" rx="18" fill="#FFFFFF" stroke="#D3E1E6"/>
<text x="1008" y="196" font-family="ui-monospace,monospace" font-size="14" fill="#0C7490">04</text>
<text x="1008" y="236" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="680" fill="#10242C">EDGE</text>
<text x="1008" y="268" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#4C6872">orca · ollama · vm</text>


</svg>
