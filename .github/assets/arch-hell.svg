    <rect class="n" x="1060" y="140" width="170" height="68" rx="12" fill="#FFFFFF" stroke="#1B8DBE" stroke-width="1.5" style="animation-delay:.36s"/>
    <text x="1145" y="178">Providers</text>
  </g>
  <path class="flow" d="M258 174 H310 M500 174 H550 M780 174 H830 M1020 174 H1060" stroke="#1B8DBE" stroke-width="1.5" fill="none"/>
</svg>
