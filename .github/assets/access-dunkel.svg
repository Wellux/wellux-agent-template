<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img">
<title>Supabase, PayPal and OpenAI stay separate doors.</title>
<defs>
<style>
  .flow { stroke-dasharray: 5 9; animation: flow 2.8s linear infinite; }
  .blink { animation: blink 1.15s steps(1) infinite; }
  .pulse { animation: pulse 2.8s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -56; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flow, .blink, .pulse { animation: none; } }
</style>

<linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#3EC4E0" stop-opacity=".16"/>
  <stop offset=".55" stop-color="#3EC4E0" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="1280" height="360" fill="#07141C"/>

<rect x="48" y="78" width="384" height="250" rx="22" fill="#0D1C26" stroke="#1D3C4A"/>
<circle cx="96" cy="132" r="16" fill="none" stroke="#3EC4E0" stroke-width="1.5"/>
<circle class="pulse" cx="96" cy="132" r="4" fill="#3EC4E0"/>
<text x="126" y="138" font-family="ui-monospace,monospace" font-size="14" fill="#8EACB8">01</text>
<text x="80" y="196" font-family="ui-sans-serif,system-ui,sans-serif" font-size="32" font-weight="680" fill="#E7F1F4">SUPABASE</text>
<text x="80" y="236" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8EACB8">Mail and OAuth.</text>
<text x="80" y="262" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8EACB8">Service role stays server-side.</text>


<rect x="448" y="78" width="384" height="250" rx="22" fill="#0D1C26" stroke="#1D3C4A"/>
<circle cx="496" cy="132" r="16" fill="none" stroke="#3EC4E0" stroke-width="1.5"/>
<circle class="pulse" cx="496" cy="132" r="4" fill="#3EC4E0"/>
<text x="526" y="138" font-family="ui-monospace,monospace" font-size="14" fill="#8EACB8">02</text>
<text x="480" y="196" font-family="ui-sans-serif,system-ui,sans-serif" font-size="32" font-weight="680" fill="#E7F1F4">PAYPAL</text>
<text x="480" y="236" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8EACB8">Amount set here.</text>
<text x="480" y="262" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8EACB8">Sandbox until a capture holds.</text>


<rect x="848" y="78" width="384" height="250" rx="22" fill="#0D1C26" stroke="#1D3C4A"/>
<circle cx="896" cy="132" r="16" fill="none" stroke="#3EC4E0" stroke-width="1.5"/>
<circle class="pulse" cx="896" cy="132" r="4" fill="#3EC4E0"/>
<text x="926" y="138" font-family="ui-monospace,monospace" font-size="14" fill="#8EACB8">03</text>
<text x="880" y="196" font-family="ui-sans-serif,system-ui,sans-serif" font-size="32" font-weight="680" fill="#E7F1F4">OPENAI</text>
<text x="880" y="236" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8EACB8">ChatGPT is not a key.</text>
<text x="880" y="262" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8EACB8">Live secret lasts minutes.</text>

</svg>
