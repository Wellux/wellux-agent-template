<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" role="img">
  <title>Access: Supabase, PayPal, OpenAI</title>
  <defs>
    <style>
      .flow { stroke-dasharray: 5 8; animation: flow 2.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -52; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="260" rx="24" fill="#F3F7F8"/>
  <line class="flow" x1="120" y1="48" x2="1160" y2="48" stroke="#0C7C9A" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g>
      <rect x="48" y="72" width="360" height="148" rx="18" fill="#FFFFFF" stroke="#D0E0E6"/>
      <text x="72" y="112" font-size="12" letter-spacing="2" fill="#4E6A76">LOGIN</text>
      <text x="72" y="150" font-size="28" font-weight="680" fill="#102028">Supabase</text>
      <text x="72" y="184" font-size="16" fill="#4E6A76">PKCE · RLS · no service role</text>
    </g>
    <g>
      <rect x="460" y="72" width="360" height="148" rx="18" fill="#FFFFFF" stroke="#0C7C9A"/>
      <text x="484" y="112" font-size="12" letter-spacing="2" fill="#0C7C9A">PAY</text>
      <text x="484" y="150" font-size="28" font-weight="680" fill="#102028">PayPal</text>
      <text x="484" y="184" font-size="16" fill="#4E6A76">server amount · signed webhook</text>
    </g>
    <g>
      <rect x="872" y="72" width="360" height="148" rx="18" fill="#FFFFFF" stroke="#D0E0E6"/>
      <text x="896" y="112" font-size="12" letter-spacing="2" fill="#4E6A76">MODEL</text>
      <text x="896" y="150" font-size="28" font-weight="680" fill="#102028">OpenAI</text>
      <text x="896" y="184" font-size="16" fill="#4E6A76">ChatGPT scope · ephemeral live</text>
    </g>
  </g>
</svg>
