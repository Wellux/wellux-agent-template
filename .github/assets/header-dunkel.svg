  <text class="rise" x="64" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#A7B0BA" style="animation-delay:.32s">OpenTelemetry · Native VMs · OrcaRouter</text>
  <g class="rise" style="animation-delay:.42s">
