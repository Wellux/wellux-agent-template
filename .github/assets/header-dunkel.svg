<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img">
<title>Wellux agent template. Compiles before it promises.</title>
<defs>
<style>
  .flow { stroke-dasharray: 5 9; animation: flow 2.8s linear infinite; }
  .blink { animation: blink 1.15s steps(1) infinite; }
  .pulse { animation: pulse 2.8s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -56; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flow, .blink, .pulse { animation: none; } }
</style>

<linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#3EC4E0" stop-opacity=".16"/>
  <stop offset=".55" stop-color="#3EC4E0" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="1280" height="640" fill="#07141C"/>

<rect width="1280" height="640" fill="url(#wash)"/>
<g stroke="#14323C" stroke-width="1" fill="none" opacity=".9">
  <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
  <path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640"/>
</g>
<polygon points="72,62 86,70 86,86 72,94 58,86 58,70" fill="#3EC4E0"/>
<text x="100" y="86" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="650" letter-spacing="3.2" fill="#8EACB8">WELLUX  ·  AGENT TEMPLATE</text>
<text x="64" y="210" font-family="ui-sans-serif,system-ui,sans-serif" font-size="84" font-weight="680" fill="#E7F1F4">Compiles</text>
<text x="64" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="84" font-weight="680" fill="#E7F1F4">before it</text>
<text x="64" y="390" font-family="ui-sans-serif,system-ui,sans-serif" font-size="84" font-weight="680" fill="#E7F1F4">promises.</text>
<text x="68" y="452" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" fill="#8EACB8">One core. Three profiles. Doors stay shut until the keys exist.</text>
<text x="68" y="560" font-family="ui-monospace,monospace" font-size="15" letter-spacing="1.4" fill="#8EACB8">RUST 1.80   ·   TESTS OFFLINE   ·   MIT OR APACHE-2.0</text>
<rect x="760" y="120" width="456" height="420" rx="24" fill="#0D1C26" stroke="#1D3C4A"/>
<line class="flow" x1="812" y1="168" x2="812" y2="492" stroke="#3EC4E0" stroke-width="1.5">
  <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.8s" repeatCount="indefinite"/>
</line>
<g font-family="ui-monospace,monospace" font-size="16">
  <g><circle class="pulse" cx="812" cy="176" r="5" fill="#3EC4E0"/><text x="840" y="172" fill="#8EACB8">01</text><text x="888" y="172" fill="#E7F1F4">CORE</text><text x="1040" y="172" fill="#8EACB8">rust</text></g>
  <g><circle class="pulse" cx="812" cy="252" r="5" fill="#7CCBEB" style="animation-delay:.4s"/><text x="840" y="248" fill="#8EACB8">02</text><text x="888" y="248" fill="#E7F1F4">SKILL</text><text x="1040" y="248" fill="#8EACB8">SKILL.md</text></g>
  <g><circle class="pulse" cx="812" cy="328" r="5" fill="#3EC4E0" style="animation-delay:.8s"/><text x="840" y="324" fill="#8EACB8">03</text><text x="888" y="324" fill="#E7F1F4">GUARD</text><text x="1040" y="324" fill="#8EACB8">approval</text></g>
  <g><circle class="pulse" cx="812" cy="404" r="5" fill="#7CCBEB" style="animation-delay:1.2s"/><text x="840" y="400" fill="#8EACB8">04</text><text x="888" y="400" fill="#E7F1F4">DOOR</text><text x="1040" y="400" fill="#8EACB8">locked</text></g>
  <g><circle class="pulse" cx="812" cy="480" r="5" fill="#3EC4E0" style="animation-delay:1.6s"/><text x="840" y="476" fill="#8EACB8">05</text><text x="888" y="476" fill="#E7F1F4">SHELL</text><text x="1040" y="476" fill="#8EACB8">ui/</text></g>
</g>

</svg>
