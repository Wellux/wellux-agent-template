<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%">
  <defs>
    <style>
      .ri { animation: rise .7s cubic-bezier(.2,.7,.3,1) both; }
      .dp { animation: drop .55s cubic-bezier(.2,.7,.3,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes drop { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .ri, .dp { animation: none; } }
    </style>
    <clipPath id="wall"><rect x="820" y="40" width="420" height="340"/></clipPath>
