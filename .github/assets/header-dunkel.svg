    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280 M0 400 H1280"/>
    <path d="M160 0 V520 M320 0 V520 M480 0 V520 M640 0 V520 M800 0 V520 M960 0 V520 M1120 0 V520"/>
  </g>
  <text class="rise" x="64" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7D8590" letter-spacing="2.4">WELLUX</text>
  <text class="rise" x="64" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#F0F6FC" style="animation-delay:.08s">Agent Native</text>
  <text class="rise" x="64" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#F0F6FC" style="animation-delay:.16s">Project Template</text>
