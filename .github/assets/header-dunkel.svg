<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="100%">
  <defs>
    <style>
      .rise { animation: rise .9s cubic-bezier(.16,.84,.32,1) both; }
      .drop { animation: drop .7s cubic-bezier(.16,.84,.32,1) both; }
      .float { animation: float 4s ease-in-out infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes drop { from { opacity: 0; transform: translateY(-28px); } to { opacity: 1; transform: none; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .rise, .drop, .float { animation: none; } }
    </style>
    <clipPath id="wall"><rect x="740" y="20" width="500" height="480"/></clipPath>
  </defs>
  <rect width="1280" height="520" rx="20" fill="#0D1117" stroke="#21262D"/>
