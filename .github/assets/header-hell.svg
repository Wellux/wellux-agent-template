<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="100%">
  <defs>
    <style>
      .rise { animation: rise .85s cubic-bezier(.2,.8,.2,1) both; }
      .drop { animation: drop .65s cubic-bezier(.2,.8,.2,1) both; }
      .float { animation: float 5s ease-in-out infinite; }
      .glow { animation: glow 3s ease-in-out infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes drop { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: none; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes glow { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .rise, .drop, .float, .glow { animation: none; } }
    </style>
    <clipPath id="wall"><rect x="720" y="16" width="520" height="500"/></clipPath>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1B8DBE"/><stop offset="100%" stop-color="#21A8E0"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7CCBEB"/><stop offset="100%" stop-color="#21A8E0"/></linearGradient>
  </defs>
  <rect width="1280" height="540" rx="20" fill="#FFFFFF" stroke="#E6EAEE"/>
  <g stroke="#F7F9FB" stroke-width="1" fill="none">
    <path d="M0 90 H1280 M0 180 H1280 M0 270 H1280 M0 360 H1280 M0 450 H1280"/>
    <path d="M160 0 V540 M320 0 V540 M480 0 V540 M640 0 V540 M800 0 V540 M960 0 V540 M1120 0 V540"/>
  </g>
  <text class="rise" x="64" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8A9099" letter-spacing="2.5">WELLUX</text>
  <text class="rise" x="64" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#0F1419" style="animation-delay:.06s">Agent Native</text>
  <text class="rise" x="64" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#0F1419" style="animation-delay:.12s">Project Template</text>
  <text class="rise" x="64" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#4B535D" style="animation-delay:.22s">Shared Rust core · Engram · Hermes skills · Guardrails</text>
  <text class="rise" x="64" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#4B535D" style="animation-delay:.26s">OpenTelemetry · Native VMs · OrcaRouter</text>
  <g class="rise" style="animation-delay:.36s">
    <rect x="64" y="328" width="112" height="34" rx="17" fill="#1B8DBE"/>
    <text x="88" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">READY</text>
    <text x="192" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8A9099">Tauri 2 · ADK-Rust</text>
  </g>
  <g clip-path="url(#wall)">
    <path class="drop float glow" d="M800 70 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="url(#g1)" style="animation-delay:.2s"/>
    <path class="drop float glow" d="M910 70 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="#21A8E0" style="animation-delay:.3s"/>
    <path class="drop float glow" d="M1020 70 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="#1B8DBE" style="animation-delay:.4s"/>
    <path class="drop float glow" d="M1130 70 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="url(#g2)" style="animation-delay:.5s"/>
    <path class="drop float glow" d="M855 160 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="#21A8E0" style="animation-delay:.35s"/>
    <path class="drop float glow" d="M965 160 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="#1B8DBE" style="animation-delay:.45s"/>
    <path class="drop float glow" d="M1075 160 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="#21A8E0" style="animation-delay:.55s"/>
    <path class="drop float glow" d="M800 250 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="url(#g2)" style="animation-delay:.5s"/>
    <path class="drop float glow" d="M910 250 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="#1B8DBE" style="animation-delay:.6s"/>
    <path class="drop float glow" d="M1020 250 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="#21A8E0" style="animation-delay:.7s"/>
    <path class="drop float glow" d="M1130 250 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="#1B8DBE" style="animation-delay:.8s"/>
    <path class="drop float glow" d="M855 340 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="#21A8E0" style="animation-delay:.65s"/>
    <path class="drop float glow" d="M965 340 l48 28 v56 l-48 28 l-48-28 v-56 z" fill="url(#g2)" style="animation-delay:.75s"/>
  </g>
</svg>
