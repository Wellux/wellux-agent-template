<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" role="img">
<title>WASM, MicroVM, Quicksand.</title>
<defs>
<style>
  .flow { stroke-dasharray: 5 9; animation: flow 2.8s linear infinite; }
  .blink { animation: blink 1.15s steps(1) infinite; }
  .pulse { animation: pulse 2.8s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -56; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flow, .blink, .pulse { animation: none; } }
</style>

<linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#3EC4E0" stop-opacity=".16"/>
  <stop offset=".55" stop-color="#3EC4E0" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="1280" height="330" fill="#07141C"/>

<rect x="48" y="48" width="384" height="240" rx="22" fill="#0D1C26" stroke="#1D3C4A"/>
<rect x="80" y="84" width="36" height="36" rx="8" fill="none" stroke="#3EC4E0" stroke-width="1.5"/>
<text x="132" y="108" font-family="ui-monospace,monospace" font-size="14" fill="#8EACB8">01</text>
<text x="80" y="176" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="680" fill="#E7F1F4">WASM</text>
<text x="80" y="214" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8EACB8">No guest OS.</text>
<text x="80" y="240" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8EACB8">The small default.</text>


<rect x="448" y="48" width="384" height="240" rx="22" fill="#0D1C26" stroke="#1D3C4A"/>
<rect x="480" y="84" width="36" height="36" rx="8" fill="none" stroke="#3EC4E0" stroke-width="1.5"/>
<text x="532" y="108" font-family="ui-monospace,monospace" font-size="14" fill="#8EACB8">02</text>
<text x="480" y="176" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="680" fill="#E7F1F4">MICROVM</text>
<text x="480" y="214" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8EACB8">Untrusted code.</text>
<text x="480" y="240" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8EACB8">The business default.</text>


<rect x="848" y="48" width="384" height="240" rx="22" fill="#0D1C26" stroke="#1D3C4A"/>
<rect x="880" y="84" width="36" height="36" rx="8" fill="none" stroke="#3EC4E0" stroke-width="1.5"/>
<text x="932" y="108" font-family="ui-monospace,monospace" font-size="14" fill="#8EACB8">03</text>
<text x="880" y="176" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="680" fill="#E7F1F4">QUICKSAND</text>
<text x="880" y="214" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8EACB8">A Linux desktop.</text>
<text x="880" y="240" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8EACB8">Only when you ask.</text>

</svg>
